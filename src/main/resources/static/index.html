<!DOCTYPE html>
<html lang="en">
<head>
    <title>URL Shortener</title>
    <style>
        body{
            font-family: Arial,serif;
            text-align:center;
            margin-top:100px;
        }

        input{
            width:300px;
            padding:10px;
        }

        button{
            padding:10px;
            margin-left:10px;
        }

        #result{
            margin-top:20px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<h2>URL Shortener</h2>

<label for="urlInput">URL:</label><input id="urlInput" placeholder="Enter long URL">
<label for="customCode">Custom Code:</label><input id="customCode" placeholder="Custom short code (optional)">

<label for="expirationTime">ExpirationTime:
</label>
<input id="expirationTime" type="datetime-local" placeholder="Enter the Expiration Time">

<button onclick="shorten()">Generate</button>


<p id="result"></p>
